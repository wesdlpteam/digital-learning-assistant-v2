# Keeps the presentation sandbox in step with the live site.
name: Rebuild sandbox

# Manual-only since 2026-08-17 (Nathan's request). The demo refreshes when he
# presses "Refresh the public demo" in the Studio (backend rebuildsandbox
# action fires this workflow_dispatch), or via the Run-workflow button here.
# The old nightly cron is gone: the demo is link-only now, so a demo that
# lags the live site is fine, and an unattended rebuild could publish a
# half-finished bulk regeneration. (A per-push trigger was rejected long ago
# for the same reason - the GAS backend commits data.json every few minutes
# during a bulk run.)
on:
  workflow_dispatch:

# Two manual runs must never push to the sandbox at once.
concurrency:
  group: rebuild-sandbox
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live site
        uses: actions/checkout@v4

      - name: Check out the sandbox
        uses: actions/checkout@v4
        with:
          # Deliberately unguessable name (2026-08-17): the demo is link-only,
          # shared with invited participants, and no longer sits next to the
          # live platform at a guessable address.
          repository: wesdlpteam/dla-demo-7kwq3
          path: sandbox-out
          # Fine-grained PAT with Contents: read+write on the sandbox repo
          # (tracks the repo across renames, so no token change was needed).
          # The default GITHUB_TOKEN cannot write to a different repository.
          token: ${{ secrets.SANDBOX_PUSH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the sandbox
        run: node tools/build-sandbox.mjs --out sandbox-out

      - name: Run the sandbox tests
        run: npm test

      - name: Report how stale the spare tool ideas are
        # These cost real AI calls and take ~16 minutes, so they are NOT
        # regenerated automatically. Report instead, so a refresh is a decision
        # rather than a surprise bill.
        run: node .github/workflows/check-spare-ideas.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Publish if anything changed
        working-directory: sandbox-out
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sandbox already matches the live site. Nothing to publish."
            exit 0
          fi
          git config user.name  "wesdlpteam"
          git config user.email "dlpteam@wesleycollege.edu.au"
          git add -A
          git commit -m "Rebuild: sync the demo with the live site ($(date -u '+%d %b %Y'))"
          git push
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Sandbox updated." >> "$GITHUB_STEP_SUMMARY"
